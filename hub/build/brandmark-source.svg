<?xml version="1.0" encoding="UTF-8"?>
<!--
  DreamEngine 图标真源 · 面板品牌标（反白透明底）
  透明背景，用于深色顶栏与「关于」弹窗；输出 cep/com.dreamengine.panel/css/brand-mark.png。

  手工修改要点：
    · 齿轮外圈由 8 段弧拼成，每段半径 29.9–31.0 各不相同 —— 这是「笔压不匀」的来源，
      改成正圆会让墨线质感消失。
    · 12 颗齿的宽度（6.9–8.3）、角度抖动（±1.9°）、出锋方向都是逐颗写死的，
      不要用 <g> 复制再旋转均分，那样会立刻变回机械齿轮。
    · 两段 feDisplacementMap 分别是「手抖波动」（低频）与「纸面毛边」（高频）。
    · 改完执行：node tools/render_icon_source.mjs && node tools/build_squircle_icon.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>面板品牌标（反白透明底）</title>
  <defs>
    <filter id="brush" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="wobble"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="grain"/>
      <feDisplacementMap in="wobble" in2="grain" scale="0.65" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- 安全边：标记按 0.82 缩放居中。满幅出图会被超椭圆圆角切掉外侧齿尖 -->
  <g transform="translate(48 48) scale(0.82) translate(-48 -48)">
  <g filter="url(#brush)" fill="#ecebe6">
