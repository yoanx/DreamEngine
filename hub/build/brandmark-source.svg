    <g transform="rotate(-4 48 48)">
    <path d="M44.55 20.5 C 44.55 15.5 45.65 11 44.85 9 C 49.15 8.6 50.85 14.5 51.05 20.5 Z" transform="rotate(-1.60 48 48)"/>
