    <path d="M44.55 20.5 C 44.55 15.5 45.65 11 46.45 9 C 50.75 8.6 50.85 14.5 51.05 20.5 Z" transform="rotate(268.10 48 48)"/>
    <path d="M44.20 20.5 C 44.20 15.5 45.42 11 44.27 9 C 49.03 8.6 51.20 14.5 51.40 20.5 Z" transform="rotate(301.10 48 48)"/>
    <path d="M43.85 20.5 C 43.85 15.5 45.18 11 46.68 9 C 51.92 8.6 51.55 14.5 51.75 20.5 Z" transform="rotate(329.50 48 48)"/>
    </g>
    <ellipse cx="78" cy="17" rx="2.5" ry="2" transform="rotate(-18 78 17)"/>
